const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let db,songs=[],playlists=[],view='home',current=null,queue=[],shuffle=false,repeat=0,objectUrl=null,history=[],busy=false;const audio=$('#audio');audio.volume=.8;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').style.display='none',4500)}function modal(html){$('#modalBody').innerHTML=html;$('#modal').showModal()}function time(n){return Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00'}
$('#files').onchange=async e=>{if(busy)return;busy=true;let count=0,duplicates=0;for(const f of e.target.files){if(!(f.type.startsWith('audio/')||/\.(mp3|m4a|wav|flac|ogg|aac)$/i.test(f.name)))continue;if(songs.some(s=>s.filename===f.name&&s.size===f.size)){duplicates++;continue}const base=f.name.replace(/\.[^.]+$/,''),parts=base.split(' - ');const s={id:crypto.randomUUID(),title:parts.length>1?parts.slice(1).join(' - '):base,artist:parts.length>1?parts[0]:'Unknown artist',mood:'Unsorted',filename:f.name,size:f.size,blob:f,liked:false,plays:0,added:Date.now(),lastPlayed:0};try{await save(s);songs.push(s);count++;toast('Importing… '+count+' songs saved')}catch{toast('Storage is full or unavailable. Some files could not be imported.');break}}busy=false;e.target.value='';render();toast(count+' songs added'+(duplicates?' · '+duplicates+' duplicates skipped':''));};
function setView(v){view=v;$('#search').value='';render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#search').oninput=()=>render();
function getList(){let list=songs;if(view==='liked')list=songs.filter(s=>s.liked);if(view==='recent')list=[...songs].filter(s=>s.lastPlayed).sort((a,b)=>b.lastPlayed-a.lastPlayed);if(view==='rotation')list=[...songs].filter(s=>s.plays).sort((a,b)=>b.plays-a.plays);if(view==='fresh')list=[...songs].sort((a,b)=>b.added-a.added);if(view.startsWith('pl:')){const p=playlists.find(p=>p.id===view.slice(3));list=(p?.ids||[]).map(id=>songs.find(s=>s.id===id)).filter(Boolean)}const q=$('#search').value.toLowerCase();return list.filter(s=>(s.title+' '+s.artist+' '+s.mood).toLowerCase().includes(q))}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#playlistNav').innerHTML=playlists.map(p=>`<button class="nav ${view==='pl:'+p.id?'active':''}" onclick="setView('pl:${p.id}')">♫ &nbsp; ${esc(p.name)}</button>`).join('');if(view==='upload'){renderUpload();return}const list=getList(),isHome=view==='home'&&!$('#search').value;let title=({'home':'Your collection','library':'Your library','liked':'Liked songs','recent':'Recently played','rotation':'On repeat','fresh':'Fresh finds'})[view]||playlists.find(p=>'pl:'+p.id===view)?.name||'Your music';$('#content').innerHTML=(isHome?`<section class="hero"><div class="record"></div><div class="eyebrow">YOUR SHARED LISTENING SPACE</div><h1>Less noise.<br>More of your music.</h1><p>A little escape, one song at a time.<br>Find your favourites. Make yourself at home.</p><button class="primary" onclick="playAll()">▶ &nbsp; Play my collection</button><button class="secondary" onclick="pick()">＋ Publish music</button></section><div class="sectionhead"><div><h2>Made for your mood</h2><div class="sub">Your library, rediscovered.</div></div><span class="muted hide-mobile" style="font-size:11px">PERSONAL MIXES ↗</span></div><div class="cards"><button class="card" onclick="setView('liked')"><span class="tag">THE ONES YOU LOVE</span><span class="symbol">♡</span><b>Liked songs</b><small>${songs.filter(s=>s.liked).length} favourites · All you</small></button><button class="card" onclick="smartMix()"><span class="tag">A LITTLE FAMILIAR. A LITTLE NEW.</span><span class="symbol">✧</span><b>Daily blend</b><small>Smart mix · From your library</small></button><button class="card" onclick="setView('rotation')"><span class="tag">CAN’T GET ENOUGH</span><span class="symbol">↻</span><b>On repeat</b><small>Your most-played tracks</small></button><button class="card" onclick="setView('fresh')"><span class="tag">NEW TO YOUR WORLD</span><span class="symbol">↗</span><b>Fresh finds</b><small>Recently added music</small></button></div>`:'')+`<div class="sectionhead"><div><h2>${esc(title)}</h2><div class="sub">${list.length} songs · Online catalogue</div></div><div class="toolbar"><button class="pill" onclick="newPlaylist()">＋ Playlist</button>${list.length?'<button class="primary" onclick="playAll()">▶ Play</button>':''}</div></div>`+(list.length?`<table class="table"><thead><tr><th style="width:35px">#</th><th>TITLE</th><th class="hide-sm">MOOD</th><th class="hide-mobile">PLAYS</th><th></th><th></th></tr></thead><tbody>${list.map((s,i)=>`<tr><td class="muted"><button aria-label="Play ${esc(s.title)}" onclick="playSong('${s.id}',getList().map(s=>s.id))">${current===s.id?'♫':i+1}</button></td><td><button class="song" style="text-align:left;padding:0" onclick="playSong('${s.id}',getList().map(s=>s.id))"><div class="cover" style="background:${cover(s)}">♫</div><div><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></div></button></td><td class="hide-sm muted">${esc(s.mood)}</td><td class="hide-mobile muted">${s.plays}</td><td><button class="rowbtn ${s.liked?'on':''}" aria-label="Toggle favourite" onclick="like('${s.id}')">${s.liked?'♥':'♡'}</button></td><td><button class="rowbtn" aria-label="Song options" onclick="options('${s.id}')">⋯</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty"><div style="font-size:28px;color:#d3f786">♫</div><b>${songs.length?'Nothing here yet':'The online library starts here'}</b>${songs.length?'Try a different search, like a song, or add tracks to this playlist.':'The administrator can publish authorised tracks for everyone to stream.'}<br><button class="primary" onclick="pick()">＋ Publish the first songs</button></div>`)+`<div class="notice"><span>ⓘ</span><span>Shared online library · Sign in to sync favourites and playlists. Preview hosting is temporary; keep backups.</span></div>`;updateNow()}
function cover(s){let h=0;for(const c of s.title)h=(h+c.charCodeAt(0)*7)%360;return `linear-gradient(135deg,hsl(${h},30%,38%),hsl(${h},25%,16%))`}
function renderUpload(){const bytes=songs.reduce((n,s)=>n+s.size,0);$('#content').innerHTML=`<div class="eyebrow">YOUR LIBRARY, YOUR RULES</div><h1 style="font-size:38px;letter-spacing:-1px">Bring your music.</h1><p class="muted">Import a few favourites or build a collection of 1,000 songs.</p><div class="empty" id="drop" style="margin-top:25px;padding:50px 20px"><div style="font-size:44px;color:var(--lime)">↥</div><b>Drop your music here</b>MP3, M4A, WAV, OGG, FLAC · Playback support varies by browser<br><button class="primary" onclick="pick()">Choose audio files</button><p style="font-size:11px">Tip: “Artist - Song title.mp3” fills in the details automatically.</p></div><div class="sectionhead"><h2>Storage & sharing</h2><span class="pill">LOCAL MODE</span></div><div class="libraryinfo"><b>${songs.length} songs · ${(bytes/1024/1024).toFixed(1)} MB saved</b><br><span id="quota" class="muted">Checking device storage…</span><hr style="border:0;border-top:1px solid #384130;margin:18px 0"><b>Where are my files?</b><br><span class="muted">Audio files and song details are stored in this browser’s IndexedDB. Playlists are saved in localStorage. They are not uploaded to the internet and are not available on other devices. Clearing site data can erase your library.</span><br><br><b>Want other people to listen?</b><br><span class="muted">That needs cloud file storage, a song database, and a protected admin login. This version is not connected to a cloud provider. A thousand 5 MB songs need about 5 GB before streaming traffic; free provider limits may not cover it. Only publish music you have permission to share.</span><br><br><button class="pill" onclick="requestPersistence()">Request persistent storage</button> <button class="pill" onclick="exportMetadata()">Export library metadata</button></div>`;navigator.storage?.estimate().then(s=>$('#quota').textContent=`Browser estimate: ${Math.round((s.usage||0)/1024/1024)} MB used of ${Math.round((s.quota||0)/1024/1024)} MB available to this origin. Limits can change.`);const drop=$('#drop');drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='var(--lime)'};drop.ondragleave=()=>drop.style.borderColor='';drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';$('#files').onchange({target:{files:e.dataTransfer.files,value:''}})}}
async function requestPersistence(){const result=await navigator.storage?.persist?.();toast(result?'Persistent storage granted. Still keep backups.':'Browser did not grant persistence. Keep your originals.')}function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}function exportMetadata(){downloadBlob(new Blob([JSON.stringify({songs:songs.map(({blob,...s})=>s),playlists},null,2)],{type:'application/json'}),'noctune-library-metadata.json');toast('Metadata exported. Audio files are not included.')}
async function playSong(id,ids){const s=songs.find(s=>s.id===id);if(!s)return;if(ids)queue=[...ids];if(current&&current!==id)history.push(current);current=id;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(s.blob);audio.src=objectUrl;try{await audio.play();s.plays++;s.lastPlayed=Date.now();await save(s)}catch(e){toast('Could not play this file. Try MP3 or another supported format.')}render()}
